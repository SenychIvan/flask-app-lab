{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-success mb-4">Список продуктів</h2>

    <table class="table table-hover table-bordered text-center align-middle shadow-sm">
        <thead class="table-success">
            <tr>
                <th>Назва товару</th>
                <th>Ціна (грн)</th>
            </tr>
        </thead>
        <tbody>
            {% for p in products %}
                <tr>
                    <td>{{ p.name }}</td>
                    <td>{{ p.price }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
