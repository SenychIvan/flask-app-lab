{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
  <h2>{{ post.title }}</h2>
  <p class="text-muted">{{ post.category.value }} | {{ post.posted.strftime('%Y-%m-%d %H:%M') }}</p>
  <p>{{ post.content }}</p>
  <p><strong>Author:</strong> {{ post.author }}</p>

  <a href="{{ url_for('posts.update_post', id=post.id) }}" class="btn btn-info">Edit</a>
  <a href="{{ url_for('posts.delete_post', id=post.id) }}" class="btn btn-danger">Delete</a>
</div>
{% endblock %}
