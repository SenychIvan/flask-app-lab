{% extends "base.html" %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('posts.static', filename='css/posts.css') }}">
{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4 text-center">All Posts</h2>
  <a href="{{ url_for('posts.create_post') }}" class="btn btn-success mb-3">+ Add Post</a>

  <div class="row">
    {% for post in posts %}
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
          <img src="{{ url_for('posts.static', filename='img/default.jpg') }}" alt="post" class="post-image">
          <div class="card-body">
            <h5 class="card-title">{{ post.title }}</h5>
            <p class="card-text">{{ post.content[:100] }}...</p>
            <p class="text-muted small">{{ post.category.value }} | {{ post.posted.strftime('%Y-%m-%d %H:%M') }}</p>
            <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-primary btn-sm">Read more</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
